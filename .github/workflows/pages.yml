name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Production-сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ASSET_PREFIX: "/laminat-sale"

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Публикация
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
